<!doctype html>
<html lang="es" data-v="2026-10-21">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel Diwilo</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="/admin/admin.css?v=2026-10-21">
</head>
<body>

<!-- Sin Cloudflare Access -->
<section class="login" id="login" hidden>
  <form id="loginForm">
    <div class="brand"><img src="/assets/img/brand/logo-mark.svg" alt="">Diwilo · Panel</div>
    <p class="muted" style="margin:0">El panel se abre con Cloudflare Access. Si tu sesión venció, vuelve a cargar la página para entrar con tu correo.</p>
    <a class="btn pri" href="/admin" style="justify-content:center;padding:11px">Entrar con Cloudflare Access</a>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<!-- App -->
<div class="app" id="app" hidden>
  <nav class="side" id="side">
    <div class="brand"><img src="/assets/img/brand/logo-mark.svg" alt="">Diwilo</div>
    <button class="tab" data-view="resumen"><i class="ph-light ph-pulse"></i>En vivo</button>
    <button class="tab" data-view="negocios"><i class="ph-light ph-buildings"></i>Negocios<span class="badge" id="bizBadge" hidden></span></button>
    <button class="tab" data-view="marketing"><i class="ph-light ph-megaphone"></i>Marketing<span class="badge" id="leadBadge" hidden title="Leads nuevos del formulario"></span></button>
    <button class="tab" data-view="finanzas"><i class="ph-light ph-chart-pie-slice"></i>Finanzas</button>
    <button class="tab" data-view="blog"><i class="ph-light ph-article"></i>Blog</button>
    <button class="tab" data-view="ia"><i class="ph-light ph-robot"></i>Integraciones e IA</button>
    <div class="spacer"></div>
    <a class="tab" href="/" target="_blank" rel="noopener"><i class="ph-light ph-arrow-square-out"></i>Ver sitio</a>
    <span class="muted" id="whoami" style="font-size:12px;padding:4px 12px;overflow:hidden;text-overflow:ellipsis"></span>
    <a class="tab" id="logout" href="/cdn-cgi/access/logout"><i class="ph-light ph-sign-out"></i>Salir</a>
  </nav>

  <!-- Cada pestaña se carga desde /admin/tabs/<id>.html + .js la primera vez que se abre (ver /admin/core.js). -->
  <main>
    <section data-section="resumen" hidden></section>
    <section data-section="negocios" hidden></section>
    <section data-section="marketing" hidden></section>
    <section data-section="finanzas" hidden></section>
    <section data-section="blog" hidden></section>
    <section data-section="ia" hidden></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/admin/core.js?v=2026-10-21"></script>
<script src="/admin/hub.js?v=2026-10-21"></script>
<script src="/admin/assistant.js?v=2026-10-21"></script>
</body>
</html>

<div class="dw-page-head">
  <div class="dw-row"><h1>Negocios</h1></div>
  <div class="dw-row">
    <div class="btn-group" id="appSeg"></div>
    <button class="btn btn-outline-secondary" id="priceBtn" title="Precios, planes y días de prueba de todas las apps y negocios"><i class="bi bi-cash-coin"></i>Precios y pruebas</button>
    <button class="btn btn-outline-secondary" id="bizArchBtn" aria-pressed="false"><i class="bi bi-archive"></i>Archivados<span class="badge text-bg-primary" id="bizArchCount" hidden></span></button>
    <button class="btn btn-primary" id="bizNewBtn"><i class="bi bi-plus-lg"></i>Nuevo negocio</button>
  </div>
</div>
<div class="btn-group mb-3" id="negSeg" role="group" aria-label="Vista"></div>
<div id="appHome" hidden>
  <p class="text-danger small" id="homeErr"></p>
  <div class="dw-grid" style="--min:150px;margin-bottom:14px" id="homeKpis"></div>
  <p class="text-body-secondary" style="margin:0 0 10px">Elige una app para ver sus negocios.</p>
  <div class="dw-grid" style="--min:290px" id="homeApps"></div>
</div>
<div id="bizView">
<p class="text-danger small" id="bizErr"></p>
<div class="dw-grid" style="--min:150px;margin-bottom:14px" id="bizKpis"></div>

<div class="dw-row" style="justify-content:space-between;margin-bottom:14px" id="bizBar">
  <div class="dw-row" id="bizFilters" role="group" aria-label="Filtrar por estado"></div>
  <label class="dw-field" style="min-width:240px;margin:0"><span class="visually-hidden">Buscar negocio</span><input class="form-control" type="search" id="bizSearch" placeholder="Buscar negocio, dueño o dirección" autocomplete="off"></label>
</div>

<form class="dw-card" id="bizNew" style="margin-bottom:14px" hidden>
  <h2>Nuevo negocio en <span data-appname></span></h2>
  <p class="text-body-secondary" style="margin:4px 0 0;font-size:13px">Se crea el negocio con su dueño y se genera un link para que el dueño cree su contraseña.</p>
  <div class="dw-form" style="margin-top:12px">
    <label class="dw-field">Nombre del negocio<input class="form-control" name="name" maxlength="120" required></label>
    <label class="dw-field" id="bizSlug">Slug (va en la URL)<input class="form-control" name="slug" maxlength="40" pattern="[a-z0-9\-]{3,40}" placeholder="mi-negocio"></label>
    <label class="dw-field">Correo del dueño<input class="form-control" name="owner_email" type="email" required></label>
    <label class="dw-field">Nombre del dueño<input class="form-control" name="owner_name" maxlength="100"></label>
    <label class="dw-field">Días de prueba<input class="form-control" name="trial_days" type="number" min="0" max="365"></label>
    <label class="dw-field" id="bizPlan" hidden>Plan de módulos<select class="form-select" name="plan_id"></select></label>
  </div>
  <div class="dw-row" style="margin-top:14px"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i>Crear e invitar</button><button class="btn btn-outline-secondary" type="button" data-cancel>Cancelar</button><span class="text-danger small" data-err></span></div>
</form>
<div id="inviteBox" style="margin-bottom:14px" hidden></div>

<div class="dw-card" id="bizArchived" style="margin-bottom:14px" hidden></div>

<div class="dw-grid" style="--min:290px" id="bizBody"></div>
<div class="dw-card" id="bizDetail" style="margin-top:14px" hidden></div>

</div>
<div id="modHost" hidden></div>

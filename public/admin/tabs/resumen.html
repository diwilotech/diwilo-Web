<div class="dw-page-head">
  <div class="dw-row"><h1>En vivo</h1></div>
  <div class="btn-group" id="range">
    <button class="btn btn-sm btn-outline-secondary" data-days="1">24 h</button><button class="btn btn-sm active btn-outline-secondary" data-days="7">7 días</button><button class="btn btn-sm btn-outline-secondary" data-days="30">30 días</button><button class="btn btn-sm btn-outline-secondary" data-days="90">90 días</button>
  </div>
</div>
<div class="dw-grid" style="--min:150px;margin-bottom:14px" id="kpis"></div>
<div class="dw-grid" style="--min:420px;margin-bottom:14px">

  <div class="dw-card"><h2><span class="live-dot"></span>Actividad en tiempo real</h2><div class="feed" id="feed"></div></div>
</div>
<div class="dw-grid" style="--min:260px">
  <div class="dw-card"><h2>Páginas más vistas</h2><div class="rank" id="rPages"></div></div>

  <div class="dw-card"><h2>Campañas (UTM)</h2><div class="rank" id="rUtm"></div></div>
  <div class="dw-card"><h2>Países</h2><div class="rank" id="rCountries"></div></div>
  <div class="dw-card"><h2>Dispositivos</h2><div class="rank" id="rDevices"></div></div>
</div>

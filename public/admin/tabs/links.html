<div class="head"><div class="row"><button class="btn menu-btn" data-menu><i class="ph-light ph-list"></i></button><h1>Links de rastreo</h1></div></div>
<form class="card" id="linkForm" style="margin-bottom:14px">
  <h2 id="linkFormTitle">Nuevo link</h2>
  <input type="hidden" name="id">
  <div class="form" style="margin-top:12px">
    <label class="f">Nombre<input class="in" name="title" placeholder="Campaña Instagram octubre" required></label>
    <label class="f">Slug (URL corta)<input class="in" name="slug" placeholder="ig-octubre"></label>
    <label class="f full">Destino<input class="in" name="target" type="url" placeholder="https://diwilo.com/servicios" required></label>
    <label class="f">utm_source<input class="in" name="utm_source" placeholder="instagram"></label>
    <label class="f">utm_medium<input class="in" name="utm_medium" placeholder="social"></label>
    <label class="f">utm_campaign<input class="in" name="utm_campaign" placeholder="octubre-2026"></label>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn pri" type="submit"><i class="ph-light ph-plus"></i>Guardar link</button><button class="btn" type="reset">Limpiar</button><span class="err" data-err></span></div>
</form>
<div class="card tbl-wrap"><table><thead><tr><th>Link</th><th>URL corta</th><th>Destino</th><th>UTM</th><th class="num">Clics</th><th></th></tr></thead><tbody id="linksBody"></tbody></table></div>
<div class="card" id="linkDetail" style="margin-top:14px" hidden></div>
